# 发布到 PyPI：先证明"装得上、跑得起来"，再上传。
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 构建
        run: |
          python -m pip install -q build
          python -m build
      - name: 装进干净环境并验证入口
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install -q dist/*.whl
          /tmp/v/bin/preflight --help > /dev/null
          /tmp/v/bin/audit-data --help > /dev/null
          /tmp/v/bin/make-dirty-sample --help > /dev/null
          /tmp/v/bin/python -c "import deliverable_check; print('version', deliverable_check.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
